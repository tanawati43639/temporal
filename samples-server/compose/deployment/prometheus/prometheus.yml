global:
  scrape_interval: 10s
scrape_configs:
  - job_name: 'temporalmetrics'
    metrics_path: /metrics
    scheme: http
    static_configs:
      # Temporal server metrics (in-network)
      - targets:
          - 'temporal:8000'
        labels:
          group: 'server-metrics'

      # Local SDK worker/client metrics (if configured)
      # worker-1: SDK :8077 + extra exporter :8078
      # worker-2: SDK :8079 + extra exporter :8081
      - targets:
          - 'host.docker.internal:8077'
          - 'host.docker.internal:8078'
          - 'host.docker.internal:8079'
          - 'host.docker.internal:8081'
        labels:
          group: 'sdk-metrics'
