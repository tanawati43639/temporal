[project]
name = "automation"
version = "0.1.0"
description = "Temporal Master Template — vertical-slice processes with a registry-driven API"
requires-python = ">=3.10"
dependencies = ["temporalio>=1.34.0", "python-dotenv>=1.0"]

[project.optional-dependencies]
# Custom web UI / registry-driven API:  uv sync --extra web
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `automation` is the application package; `config` holds central, environment-
# level settings shared across every process, so it lives outside it.
packages = ["src/automation", "config"]
